version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: careersignal_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-careersignal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-careersignal_secret}
      POSTGRES_DB: ${POSTGRES_DB:-careersignal_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careersignal -d careersignal_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: careersignal_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: careersignal_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: careersignal_web
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000


volumes:
  postgres_data:
  redis_data:
